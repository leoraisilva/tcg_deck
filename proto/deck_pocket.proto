syntax = "proto3";

option go_package = "go/pb";

service DeckService {
    rpc CreateDeck (Request) returns (Response);
    rpc GetDeck (GetDeckResquest) returns (Response);
    rpc AddCard (AddCardRequest) returns (Response);
    rpc EditDeck (EditCardRequest) returns (Response);
    rpc RemoveDeck (GetDeckResquest) returns (ResponseMessage);
}

message GetDeckResquest {
    int32 id_deck = 1;
}

message Request {
    int32 quantidade = 1;
    string tipo = 2;
    Estatistica estatistica = 3;
}

message Response {
    int32 ID = 1;
    int32 quantidade = 2;
    string tipo = 3;
    repeated CardResponse card = 4;
    Estatistica estatistica = 5;
}

message CardResponse {
    int32 ID = 1;
    string card_type = 2;
    Pokemon pokemon = 3;
    Item item = 4;
    Apoiador apoiador = 5;
}

message AddCardRequest {
    int32 id_deck = 1;
    repeated Card card = 2;
}

message EditCardRequest {
    int32 id_deck = 1;
    repeated Card card = 2;
}

message ResponseMessage {
    string response = 1;
}


message Card {
    int32 ID = 1;
    string card_type = 2;
    int32 id_pokemon = 3;
    int32 id_item = 4;
    int32 id_apoiador = 5;
}

message Pokemon {
    int32 ID = 1;
    string nome = 2;
    string card_type = 3;
    string tipo = 4;
    int32 estagio = 5;
    int32 geracao = 6;
    int32 ps = 7;
    int32 recuo = 8;
    string fraqueza = 9;
    repeated Ataque ataque = 10;
    repeated Habilidade habilidade = 11;
}

message Ataque {
    string nome_ataque = 1;
    int32 dano_ataque = 2;
    string custo_ataque = 3;
    string efeito_ataque = 4;
}

message Habilidade {
    string nome_habilidade = 1;
    string efeito_habilidade = 2;
}

message Apoiador {
    int32 ID = 1;
    string nome = 2;
    string card_type = 3;
    string efeito = 4;
}

message Item {
    int32 ID = 1;
    string nome = 2;
    string card_type = 3;
    string efeito = 4;
}

message Estatistica {
    int32 id_estatisca = 1;
    int32 vitoria = 2;
    int32 derrota = 3;
    int32 total = 4;
    int32 ponto_ganho = 5;
    int32 ponto_perdido = 6;
    float media_pontos = 7;
}
